name: Publish

# The release pipeline, driven by the v* tag `cargo xtask release` pushes
# from release.yml on every merge to main:
#   1. build the Tauri desktop installers (macOS .dmg, Windows .exe / .msi)
#      on GitHub-hosted runners, signed for the auto-updater,
#   2. attach them + the updater manifest (tauri.json) to the GitHub Release
#      xtask already created,
#   3. deploy the Wasm/web stack to production via `cargo xtask deploy`,
#      which runs ON THE RUNNER at the tag checkout: it rsyncs the tracked
#      config to the box, pulls this release's ghcr images (waiting out
#      docker-images.yml), and reconciles with docker compose — the box holds
#      no deploy scripts and its git checkout is never consulted, so config
#      and images always come from the same commit (issue #512). When the
#      release is relay-compatible (deploy-gate = `xtask deploy --gate`: no
#      semver-incompatible bump of manabrew-protocol / manabrew-relay-protocol /
#      manabrew-agent-interface / manabrew-server /
#      manabrew-hub), deploy-web ships the WEB container EARLY — in parallel
#      with the installer builds. The relay and hub are deferred to the final
#      deploy job. Incompatible releases keep the old ordering: deploy only
#      after the Release has all its assets, so no installed client is
#      stranded against a relay it can't talk to.
#
#      /manifest.json needs no deploy-time hold anymore: xtask creates the
#      Release as a DRAFT, the release job attaches ops/manifest.json plus
#      the installers and publishes it, and Caddy redirects to the LATEST
#      release's copy — so installed apps can only ever be told about a
#      release whose installers exist.
# There is no main-push deploy: main commits only run release.yml.
#
# GitHub-hosted runners are free for public repositories (unlimited minutes
# on standard ubuntu-latest / windows-latest / macos-latest). The previous
# revision used self-hosted runners; migrating off them lets us drop the
# manual provisioning step (scripts/setup-{linux,windows}-runner.{sh,ps1}
# are still kept around for the parity dashboard host).

on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── macOS .dmg ─────────────────────────────────────────────────────
  # macos-latest = Apple Silicon (arm64). Produces an arm64 .dmg. If you
  # ever need Intel too, add an `arch: [arm64, x86_64]` matrix and pass
  # `--target` to `tauri build`.
  macos-dmg:
    name: Build macOS .dmg
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          clean: true
          fetch-depth: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Set up GraalVM (JDK 21)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "21"
          distribution: "graalvm-community"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: "maven"

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tauri-macos
          # Restore-only (all jobs below too): tag-scoped saves are unreadable
          # by later tags and would evict cache-warm.yml's main-scoped caches.
          save-if: false

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1

      - run: yarn

      # Mirrors what scripts/ensure-wasm.mjs hashes (its own stamp can't be
      # used here: it hashes card-data mtimes, which a fresh checkout always
      # changes). The forge gitlink stands in for the card-data dirs.
      - name: Compute wasm output key
        id: wasm-key
        shell: bash
        run: echo "key=wasm-output-$(git rev-parse HEAD:forge)-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'manabrew-rs/**/*.rs', 'manabrew-rs/**/Cargo.toml', 'scripts/build-wasm.mjs') }}" >> "$GITHUB_OUTPUT"

      - name: Wasm output cache
        id: wasm-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            src/wasm
            public/wasm
          key: ${{ steps.wasm-key.outputs.key }}

      - name: Build WASM + bundle cards
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: yarn build:wasm

      - name: Harness cache keys
        id: harness-keys
        shell: bash
        run: |
          echo "jar=$(node scripts/harness.mjs checksum)" >> "$GITHUB_OUTPUT"
          echo "native=$(node scripts/harness.mjs native-checksum)" >> "$GITHUB_OUTPUT"

      # The generated protocol sources ship with the jar: they sit under
      # forge-harness/src, so computeChecksum() hashes them. Without them the
      # stored checksum can never match a key computed before codegen, and
      # ensure:harness rebuilds on every run.
      - name: Cache Forge harness jar
        uses: actions/cache/restore@v4
        with:
          path: |
            forge-harness/target/forge-harness-jar-with-dependencies.jar
            forge-harness/target/.harness-sources-checksum
            forge-harness/src/main/java/forge/harness/protocol
          key: harness-jar-v2-${{ steps.harness-keys.outputs.jar }}

      # The key is the only guard against a stale library here: `ensure:harness`
      # re-checks the jar at runtime, but nothing revalidates this artifact.
      - name: Cache Forge native library
        id: forge-native-cache
        uses: actions/cache/restore@v4
        with:
          path: forge-harness/native/build
          key: forge-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.harness-keys.outputs.native }}

      - name: Build Forge harness jar (Maven, GraalVM JDK 21)
        run: yarn ensure:harness

      - name: Build native Forge library (GraalVM native-image)
        if: steps.forge-native-cache.outputs.cache-hit != 'true'
        run: ./forge-harness/build-native.sh

      # Proves the library actually runs, not merely that it exists: a cache hit
      # restores forge-harness/native/build without anything else exercising it.
      - name: Smoke the Forge native library
        env:
          SELF_HOSTED_NODE_GRAAL_SMOKE: "1"
          RUST_LOG: self_hosted_node=info
        run: cargo run -p self-hosted-node --features graal-forge

      - name: Tauri build (macOS)
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          TAURI_BUNDLER_DMG_IGNORE_CI: "false"
        with:
          tauriScript: yarn tauri
          args: --features forge-room --config src-tauri/updater.conf.json --verbose
          retryAttempts: 2

      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ github.sha }}
          # Cargo workspace lives at repo root; target/ is there, not in src-tauri/.
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app.tar.gz
            target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error
          retention-days: 30

      - name: Build changelog
        id: changelog
        uses: ./.github/actions/commit-changelog
        with:
          before: ${{ github.event.before }}
          after: ${{ github.sha }}

      - name: Post Discord embed (macOS artifact)
        if: ${{ success() }}
        uses: ./.github/actions/discord-notify
        with:
          bot-token: ${{ secrets.DISCORD_BOT_TOKEN }}
          channel-id: ${{ secrets.DISCORD_DEPLOY_CHANNEL_ID }}
          title: "🍎 macOS build ready"
          color: "5793266" # 0x5865F2 blurple
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          actor: ${{ github.actor }}
          sha: ${{ github.sha }}
          description: |
            🧪 Fresh `.dmg` artifact attached to the workflow run.

            📦 [Download `macos-dmg-${{ github.sha }}` from the workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) (sign-in required, 30-day retention).

            📝 **Changelog**
            ${{ steps.changelog.outputs.changelog }}

  # ── Windows .exe ───────────────────────────────────────────────────
  # windows-latest is x86_64. Tauri downloads its pinned NSIS + WiX toolsets
  # during bundling. MSVC env is loaded per-step via ilammy/msvc-dev-cmd.
  windows-exe:
    name: Build Windows .exe
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          clean: true
          fetch-depth: 10

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Set up GraalVM (JDK 21)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "21"
          distribution: "graalvm-community"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: "maven"

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tauri-windows
          save-if: false

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1

      - run: yarn

      # Mirrors what scripts/ensure-wasm.mjs hashes (its own stamp can't be
      # used here: it hashes card-data mtimes, which a fresh checkout always
      # changes). The forge gitlink stands in for the card-data dirs.
      - name: Compute wasm output key
        id: wasm-key
        shell: bash
        run: echo "key=wasm-output-$(git rev-parse HEAD:forge)-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'manabrew-rs/**/*.rs', 'manabrew-rs/**/Cargo.toml', 'scripts/build-wasm.mjs') }}" >> "$GITHUB_OUTPUT"

      - name: Wasm output cache
        id: wasm-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            src/wasm
            public/wasm
          key: ${{ steps.wasm-key.outputs.key }}

      - name: Build WASM + bundle cards
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: yarn build:wasm

      - name: Harness cache keys
        id: harness-keys
        shell: bash
        run: |
          echo "jar=$(node scripts/harness.mjs checksum)" >> "$GITHUB_OUTPUT"
          echo "native=$(node scripts/harness.mjs native-checksum)" >> "$GITHUB_OUTPUT"

      # The generated protocol sources ship with the jar: they sit under
      # forge-harness/src, so computeChecksum() hashes them. Without them the
      # stored checksum can never match a key computed before codegen, and
      # ensure:harness rebuilds on every run.
      - name: Cache Forge harness jar
        uses: actions/cache/restore@v4
        with:
          path: |
            forge-harness/target/forge-harness-jar-with-dependencies.jar
            forge-harness/target/.harness-sources-checksum
            forge-harness/src/main/java/forge/harness/protocol
          key: harness-jar-v2-${{ steps.harness-keys.outputs.jar }}

      # The key is the only guard against a stale library here: `ensure:harness`
      # re-checks the jar at runtime, but nothing revalidates this artifact.
      - name: Cache Forge native library
        id: forge-native-cache
        uses: actions/cache/restore@v4
        with:
          path: forge-harness/native/build
          key: forge-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.harness-keys.outputs.native }}

      - name: Build Forge harness jar (Maven, GraalVM JDK 21)
        run: yarn ensure:harness

      - name: Build native Forge library (GraalVM native-image)
        if: steps.forge-native-cache.outputs.cache-hit != 'true'
        run: ./forge-harness/build-native.ps1
        shell: pwsh

      # Proves the library actually runs, not merely that it exists: a cache hit
      # restores forge-harness/native/build without anything else exercising it.
      - name: Smoke the Forge native library
        env:
          SELF_HOSTED_NODE_GRAAL_SMOKE: "1"
          RUST_LOG: self_hosted_node=info
        run: cargo run -p self-hosted-node --features graal-forge

      - name: Tauri build (Windows)
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tauriScript: yarn tauri
          args: --features forge-room --config src-tauri/updater.conf.json --verbose
          retryAttempts: 2

      - name: Upload .exe
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe-${{ github.sha }}
          # Cargo workspace lives at repo root; target/ is there, not in src-tauri/.
          # NSIS produces the self-installing .exe, WiX produces the .msi.
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
            target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30

      - name: Build changelog
        id: changelog
        uses: ./.github/actions/commit-changelog
        with:
          before: ${{ github.event.before }}
          after: ${{ github.sha }}

      # Git for Windows ships bash + jq + curl on the runner image, so the
      # composite's bash implementation works here too.
      - name: Post Discord embed (Windows artifact)
        if: ${{ success() }}
        uses: ./.github/actions/discord-notify
        with:
          bot-token: ${{ secrets.DISCORD_BOT_TOKEN }}
          channel-id: ${{ secrets.DISCORD_DEPLOY_CHANNEL_ID }}
          title: "🪟 Windows build ready"
          color: "5793266" # 0x5865F2 blurple
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          actor: ${{ github.actor }}
          sha: ${{ github.sha }}
          description: |
            🧪 Fresh `.exe` + `.msi` artifact attached to the workflow run.

            📦 [Download `windows-exe-${{ github.sha }}` from the workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) (sign-in required, 30-day retention).

            📝 **Changelog**
            ${{ steps.changelog.outputs.changelog }}

  # ── iOS .ipa (SideStore) ───────────────────────────────────────────
  # Unsigned IPA for sideloading via SideStore, which re-signs on-device
  # with the user's own Apple ID. Mobile builds neither host Forge rooms
  # nor need the GraalVM harness, so this job skips GraalVM/Maven entirely
  # (tauri.ios.conf.json overrides beforeBuildCommand to `yarn vite:build`).
  ios-ipa:
    name: Build iOS .ipa
    # Pinned to macos-15 (Xcode 16.4): Xcode 26 (macos-latest/macos-26) dropped
    # the swiftCompatibility* libs that swift-rs-built objects still reference,
    # so the archive link fails — tauri-apps/tauri#15066. Re-evaluate on a
    # tauri/rustc fix; sideloaded unsigned IPAs are exempt from the App Store
    # iOS-26-SDK deadline.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          clean: true
          fetch-depth: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,wasm32-unknown-unknown

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tauri-ios
          save-if: false

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1

      - run: yarn

      # Mirrors what scripts/ensure-wasm.mjs hashes (its own stamp can't be
      # used here: it hashes card-data mtimes, which a fresh checkout always
      # changes). The forge gitlink stands in for the card-data dirs.
      - name: Compute wasm output key
        id: wasm-key
        shell: bash
        run: echo "key=wasm-output-$(git rev-parse HEAD:forge)-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'manabrew-rs/**/*.rs', 'manabrew-rs/**/Cargo.toml', 'scripts/build-wasm.mjs') }}" >> "$GITHUB_OUTPUT"

      - name: Wasm output cache
        id: wasm-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            src/wasm
            public/wasm
          key: ${{ steps.wasm-key.outputs.key }}

      - name: Build WASM + bundle cards
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: yarn build:wasm

      # tauri.ios.conf.json bundles resources/cardset.rkyv; the tauri CLI
      # validates it before cargo build (where src-tauri/build.rs would
      # otherwise produce it), so a clean runner needs it built up front.
      - name: Build cardset archive
        run: |
          cargo run -p forge-cardset-archive --features build --release \
            --bin build-cardset-archive

      - name: Tauri build (iOS, unsigned)
        run: yarn tauri ios build --no-sign

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ github.sha }}
          path: src-tauri/gen/apple/build/arm64/*.ipa
          if-no-files-found: error
          retention-days: 30

  # ── Android .apk ───────────────────────────────────────────────────
  # arm64 APK attached to the GitHub Release. Like iOS, Android hosts no
  # Forge rooms and skips the GraalVM harness (tauri.android.conf.json
  # overrides beforeBuildCommand); the card DB is embedded in the binary
  # (card_db.rs) since APK assets can't be mmap'd. The SDK + an NDK ship
  # preinstalled on ubuntu-latest; scripts/mobile-dev.mjs derives
  # ANDROID_HOME / NDK_HOME. The release APK is unsigned — a keystore
  # secret would be needed to produce an installable signed build.
  android-apk:
    name: Build Android .apk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          clean: true
          fetch-depth: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,wasm32-unknown-unknown

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tauri-android
          save-if: false

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1

      - run: yarn

      # Mirrors what scripts/ensure-wasm.mjs hashes (its own stamp can't be
      # used here: it hashes card-data mtimes, which a fresh checkout always
      # changes). The forge gitlink stands in for the card-data dirs.
      - name: Compute wasm output key
        id: wasm-key
        shell: bash
        run: echo "key=wasm-output-$(git rev-parse HEAD:forge)-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'manabrew-rs/**/*.rs', 'manabrew-rs/**/Cargo.toml', 'scripts/build-wasm.mjs') }}" >> "$GITHUB_OUTPUT"

      - name: Wasm output cache
        id: wasm-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            src/wasm
            public/wasm
          key: ${{ steps.wasm-key.outputs.key }}

      - name: Build WASM + bundle cards
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: yarn build:wasm

      # card_db.rs include_bytes!es resources/cardset.rkyv on Android; build
      # it up front so a clean runner doesn't depend on build.rs ordering.
      - name: Build cardset archive
        run: |
          cargo run -p forge-cardset-archive --features build --release \
            --bin build-cardset-archive

      - name: Tauri build (Android APK, arm64)
        run: node scripts/mobile-dev.mjs android build --apk --target aarch64

      - name: Upload .apk
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.sha }}
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

  # ── Publish GitHub Release ─────────────────────────────────────────
  # Downloads the artifacts built above, generates the updater manifest,
  # and attaches everything to the GitHub Release xtask created for the tag.
  release:
    name: Publish GitHub Release
    needs: [macos-dmg, windows-exe]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: xtask-deploy
          save-if: false

      # Prebuilt deploy tool: an evergreen binary — it fetches the deployed
      # ref's config from GitHub at run time, so one download deploys (or
      # rolls back to) any release; ops/deploy-tool-version in the fetched
      # config refuses a binary that is too old. Static musl build (the
      # xtask dep graph is pure Rust; rust-lld links it without musl-gcc),
      # so it runs on any x86_64 Linux regardless of glibc, Alpine included.
      - name: Build xtask binary (release asset)
        env:
          RUSTFLAGS: -C linker=rust-lld
          # Default for `deploy --tag`: the shipped binary knows which
          # release it belongs to. Config itself is fetched per-ref at
          # deploy time, so any binary can deploy any ref.
          XTASK_BUILD_TAG: ${{ github.ref_name }}
        run: |
          cargo build --release -p xtask --target x86_64-unknown-linux-musl
          mkdir -p release-assets
          cp target/x86_64-unknown-linux-musl/release/xtask release-assets/manabrew-xtask-linux-x86_64

      # The self-hosted relay: one static binary somebody drops on a Linux box.
      # Unlike xtask this graph is not pure Rust (aws-lc-rs and zstd are C), so
      # it needs a real musl C toolchain rather than rust-lld on its own.
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build self-hosted relay (release asset)
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          AR_x86_64_unknown_linux_musl: ar
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          cargo build --release -p manabrew-server --target x86_64-unknown-linux-musl
          cp target/x86_64-unknown-linux-musl/release/manabrew-server \
            release-assets/manabrew-server-linux-x86_64

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg-${{ github.sha }}
          path: release-assets/macos

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-exe-${{ github.sha }}
          path: release-assets/windows

      - name: Generate updater manifest (tauri.json)
        run: node scripts/gen-updater-manifest.mjs --tag "${{ github.ref_name }}" --assets release-assets --out release-assets/tauri.json

      # Attach artifacts to the DRAFT release xtask created and publish it
      # (draft: false). Omitting `body` leaves the release notes untouched.
      - name: Attach artifacts to release
        id: publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          files: |
            release-assets/macos/**/*.dmg
            release-assets/macos/**/*.app.tar.gz
            release-assets/macos/**/*.app.tar.gz.sig
            release-assets/windows/**/*.exe
            release-assets/windows/**/*.exe.sig
            release-assets/windows/**/*.msi
            release-assets/tauri.json
            release-assets/manabrew-xtask-linux-x86_64
            release-assets/manabrew-server-linux-x86_64
            ops/manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch release body for Discord
        id: relbody
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          BODY=$(gh release view "$TAG" --json body --jq .body 2>/dev/null || echo '')
          {
            echo 'body<<RELBODY_EOF'
            echo "$BODY"
            echo 'RELBODY_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Post Discord embed (release published)
        if: steps.publish.outputs.url != ''
        uses: ./.github/actions/discord-notify
        with:
          bot-token: ${{ secrets.DISCORD_BOT_TOKEN }}
          channel-id: ${{ secrets.DISCORD_DEPLOY_CHANNEL_ID }}
          title: ${{ (contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha')) && format('🧪 manabrew {0} (pre-release)', github.ref_name) || format('🎁 manabrew {0} released', github.ref_name) }}
          color: ${{ (contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha')) && '16753920' || '5763719' }} # orange / green
          url: ${{ steps.publish.outputs.url }}
          actor: ${{ github.actor }}
          sha: ${{ github.sha }}
          description: |
            📥 Public download (no GitHub account needed): ${{ steps.publish.outputs.url }}
            📝 **Changelog**
            ${{ steps.relbody.outputs.body }}

  # ── Attach mobile artifacts to the Release ─────────────────────────
  # Uploads the iOS .ipa and Android .apk to the published Release. Kept
  # OUT of the `release` job's `needs` so a flaky mobile build never blocks
  # the desktop installers: this job runs after `release` regardless of the
  # mobile jobs' results (`if: always()`), downloads whichever artifacts
  # exist, and uploads each — a missing one is skipped, not fatal.
  release-mobile:
    name: Attach mobile artifacts to release
    needs: [release, ios-ipa, android-apk]
    if: ${{ always() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download iOS IPA
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa-${{ github.sha }}
          path: mobile/ios

      - name: Download Android APK
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: android-apk-${{ github.sha }}
          path: mobile/android

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          shopt -s globstar nullglob
          files=(mobile/ios/**/*.ipa mobile/android/**/*.apk)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning::No mobile artifacts found — both mobile builds failed?"
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "Uploading $f"
            gh release upload "$TAG" "$f" --clobber --repo "$REPO"
          done

  # ── Early web deploy gate ──────────────────────────────────────────
  # Decides whether the web stack can ship BEFORE the installer builds
  # finish. Safe iff no crate an already-installed client talks to took a
  # semver-incompatible bump since the previous release — otherwise an old
  # desktop/mobile app would face a relay/hub it can't talk to, with no
  # updated installer to move to yet. The per-crate versions in
  # ops/manifest.json (maintained by `cargo xtask release`) are the signal.
  deploy-gate:
    name: Early web deploy gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: xtask-deploy
          save-if: false

      # Semver compatibility of the client-facing crates vs the previous
      # release, decided in Rust with the same semver crate the release
      # tooling uses (xtask/src/deploy.rs) instead of bash + jq (#512).
      - name: Compare client-facing crate versions with the previous release
        id: gate
        env:
          XTASK_BUILD_TAG: ${{ github.ref_name }}
        run: cargo xtask deploy --gate --tag "${GITHUB_REF_NAME}"
    outputs:
      early: ${{ steps.gate.outputs.early }}

  # ── Early web deploy ───────────────────────────────────────────────
  # Ships the WEB container as soon as the tag lands instead of after the
  # ~60–90 min installer builds. `xtask deploy` pulls the images at THIS
  # release's tag with a retry loop that waits out docker-images.yml —
  # resolving `latest` mid-release briefly shipped N-1 (issue #510).
  #
  # --web-only: manabrew-server and manabrew-hub stay put until the final
  # deploy. They are what an already-installed desktop/mobile app talks to,
  # and moving them here would put those clients in front of a new relay with
  # no installer published yet to update to.
  #
  # /manifest.json needs no hold: it redirects to the latest Release's copy,
  # and this release is still a draft here, so `latest` is the previous one.
  deploy-web:
    name: Deploy web (early)
    needs: [deploy-gate]
    if: needs.deploy-gate.outputs.early == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: wasm-deploy
      cancel-in-progress: false
    steps:
      # Full history: xtask asserts HEAD is the tag and builds the changelog
      # against the previously deployed tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: xtask-deploy
          save-if: false

      - name: Deploy web (xtask, from the runner)
        id: deploy
        continue-on-error: true
        env:
          XTASK_BUILD_TAG: ${{ github.ref_name }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          {
            echo "Host prod-box"
            echo "  HostName $HOST"
            echo "  User $USER"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  StrictHostKeyChecking yes"
          } >> ~/.ssh/config
          cargo xtask deploy --tag "$GITHUB_REF_NAME" --web-only \
            --host prod-box --path "$DEPLOY_PATH" 2>&1 | tee deploy.log
          exit ${PIPESTATUS[0]}

      - name: Post Discord embed (as bot)
        if: always()
        continue-on-error: true
        uses: ./.github/actions/discord-notify
        with:
          bot-token: ${{ secrets.DISCORD_BOT_TOKEN }}
          channel-id: ${{ secrets.DISCORD_DEPLOY_CHANNEL_ID }}
          title: ${{ steps.deploy.outcome == 'success' && '🌐 Early web deploy successful' || '💥 Early web deploy failed' }}
          color: ${{ steps.deploy.outcome == 'success' && '5763719' || '15548997' }} # green / red
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          actor: ${{ github.actor }}
          sha: ${{ github.sha }}
          description: "(no log captured — the deploy failed before any output; see workflow run)"
          description-file: deploy.log

      - name: Fail job if deploy failed
        if: steps.deploy.outcome != 'success'
        run: |
          echo "deploy step outcome: ${{ steps.deploy.outcome }}"
          exit 1

  # ── Deploy production (finalize) ───────────────────────────────────
  # Runs once the Release has all its installer artifacts. On the early path
  # it rolls out the relay + hub the --web-only run deferred; on the gated
  # (semver-incompatible) path it is the full deploy, running LAST so the
  # tauri.json and manifest.json redirects never point at assets that don't
  # exist yet. The relay only restarts when its binary actually changed
  # (xtask compares sha256s), so this is a near-no-op when the early path
  # already shipped everything else.
  # Job-level concurrency serializes deploys across runs (two tags in flight
  # must not deploy concurrently).
  deploy:
    name: Deploy production
    needs: [release, deploy-gate, deploy-web]
    if: ${{ always() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: wasm-deploy
      cancel-in-progress: false
    steps:
      # Full history: xtask asserts HEAD is the tag and builds the changelog
      # against the previously deployed tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: xtask-deploy
          save-if: false

      - name: Deploy production (xtask, from the runner)
        id: deploy
        continue-on-error: true
        env:
          XTASK_BUILD_TAG: ${{ github.ref_name }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          {
            echo "Host prod-box"
            echo "  HostName $HOST"
            echo "  User $USER"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  StrictHostKeyChecking yes"
          } >> ~/.ssh/config
          cargo xtask deploy --tag "$GITHUB_REF_NAME" \
            --host prod-box --path "$DEPLOY_PATH" 2>&1 | tee deploy.log
          exit ${PIPESTATUS[0]}

      - name: Post Discord embed (as bot)
        if: always()
        continue-on-error: true
        uses: ./.github/actions/discord-notify
        with:
          bot-token: ${{ secrets.DISCORD_BOT_TOKEN }}
          channel-id: ${{ secrets.DISCORD_DEPLOY_CHANNEL_ID }}
          title: ${{ steps.deploy.outcome == 'success' && '🚀 Wasm deploy successful' || '💥 Wasm deploy failed' }}
          color: ${{ steps.deploy.outcome == 'success' && '5763719' || '15548997' }} # green / red
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          actor: ${{ github.actor }}
          sha: ${{ github.sha }}
          description: "(no log captured — the deploy failed before any output; see workflow run)"
          description-file: deploy.log

      - name: Fail job if deploy failed
        if: steps.deploy.outcome != 'success'
        run: |
          echo "deploy step outcome: ${{ steps.deploy.outcome }}"
          exit 1

  # ── Publish SideStore source (runs after web deploy) ───────────────
  # Ships the unsigned iOS IPA + a regenerated apps.json to the deploy
  # host's ops/sidestore/ dir, bind-mounted into the caddy container at
  # /srv/manabrew/sidestore (compose.production.yml). Runs after `deploy`
  # so the /sidestore Caddy route and the bind-mount are live before the
  # files land. SideStore source URL: play.manabrew.app/sidestore/apps.json.
  deploy-sidestore:
    name: Publish SideStore source
    needs: [deploy, ios-ipa]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: sidestore-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa-${{ github.sha }}
          path: ipa

      - name: Stage SideStore artifacts
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p sidestore-out
          cp "$(find ipa -name '*.ipa' | head -1)" "sidestore-out/Manabrew-${VERSION}.ipa"
          cp src-tauri/icons/512x512.png sidestore-out/icon.png
          node scripts/gen-sidestore-source.mjs \
            --tag "$GITHUB_REF_NAME" \
            --ipa "sidestore-out/Manabrew-${VERSION}.ipa" \
            --out sidestore-out/apps.json \
            --date "$(date -u +%Y-%m-%d)"

      - name: Rsync to deploy host
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -az --chmod=F644 \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            sidestore-out/ "$USER@$HOST:$DEPLOY_PATH/ops/sidestore/"
