name: Docker images

# Builds and pushes the self-hosting images to the GitHub Container Registry
# (ghcr.io) so deployments can `docker pull` instead of cloning the repo and
# building:
#   - ghcr.io/<owner>/manabrew-server : the multiplayer relay (small Rust binary)
#   - ghcr.io/<owner>/manabrew-web    : the browser client + Caddy (WASM + Vite + docs)
#   - ghcr.io/<owner>/manabrew-node   : the headless Forge room host (node + Forge as a GraalVM native library)
#
# GHCR is free and unlimited for public images and authenticates with the
# built-in GITHUB_TOKEN — no registry secrets to configure. One-time setup: after
# the first push, set each package's visibility to Public in the org's package
# settings so self-hosters can pull without logging in.
#
# The web image is relay-agnostic: it defaults to the official public relay and
# is repointed at runtime via RELAY_HOST/RELAY_PORT/RELAY_PASSWORD (the
# entrypoint writes /srv/manabrew/config.js on start). So no VITE_RELAY_* build
# args are baked here.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra image tag to push (in addition to the git ref)"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Web Image is only in Oracle GraalVM 25.1+, which is still an EA build.
  # Keep these in step with staging-deploy.yml: the two legs build the same
  # engine, and a version that only exists in one of them is how staging and
  # production quietly diverge.
  GRAALVM_EA_TAG: jdk-25i3-25.0.4.1-ea.03
  BINARYEN_VERSION: "123"

jobs:
  build:
    name: Build & push ${{ matrix.image }}
    # Skip on forks: they can't push to this repo's package namespace.
    if: github.repository == 'witchesofthehill/manabrew'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: manabrew-server
            dockerfile: manabrew-rs/crates/manabrew-server/Dockerfile
          - image: manabrew-web
            dockerfile: Dockerfile.web
            # Route mana symbols through the web image's own same-origin Caddy
            # proxy (ops/Caddyfile → /scryfall-symbols/) instead of fetching
            # svgs.scryfall.io directly, which trips CORS. The proxy ships in
            # every web image, so this is safe for self-hosters too.
            build-args: |
              VITE_SCRYFALL_SYMBOL_BASE=/scryfall-symbols/
          - image: manabrew-node
            dockerfile: manabrew-rs/crates/self-hosted-node/Dockerfile
          - image: manabrew-hub
            dockerfile: manabrew-rs/crates/manabrew-hub/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          # `latest` only on real version tags, plus semver and the raw ref.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event.inputs.tag != '' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}

      # The wasm Forge engine is not in the repo (build outputs are ignored) and
      # nothing else produces it, so the image would carry the Settings toggle
      # with no engine behind it. The same script builds the staging image. The
      # engine ships in every web image and the runtime flag exposes its opt-in
      # toggle in both staging and production.
      - name: Cache the Web Image toolchain
        if: matrix.image == 'manabrew-web'
        id: webimage-toolchain
        uses: actions/cache@v4
        with:
          path: ~/.local/webimage
          key: webimage-${{ env.GRAALVM_EA_TAG }}-binaryen-${{ env.BINARYEN_VERSION }}

      - name: Install the Web Image toolchain
        if: matrix.image == 'manabrew-web' && steps.webimage-toolchain.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/webimage" && cd "$HOME/.local/webimage"
          curl -fsSL -o graalvm.tar.gz \
            "https://github.com/graalvm/oracle-graalvm-ea-builds/releases/download/${GRAALVM_EA_TAG}/graalvm-jdk-${GRAALVM_EA_TAG#jdk-}_linux-x64_bin.tar.gz"
          tar xzf graalvm.tar.gz && rm graalvm.tar.gz
          curl -fsSL -o binaryen.tar.gz \
            "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          tar xzf binaryen.tar.gz && rm binaryen.tar.gz

      - name: Build the wasm Forge engine
        if: matrix.image == 'manabrew-web'
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/webimage/binaryen-version_${BINARYEN_VERSION}/bin:$PATH"
          WEBIMAGE_GRAALVM_HOME="$(echo "$HOME"/.local/webimage/graalvm-*)"
          export WEBIMAGE_GRAALVM_HOME
          wasm-as --version
          corepack enable
          yarn install --frozen-lockfile
          scripts/build-forge-wasm.sh
          ls -la public/forge/

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build-args }}
          # amd64 only: the web image compiles Rust→WASM + a Node/Astro build,
          # which is impractical under arm64 QEMU emulation. Add
          # linux/arm64 here (on a native arm runner) if you need it.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layers live in GHCR, not the Actions cache: `mode=max` saves every
          # intermediate stage, which as `type=gha` filled 6.3GB of the repo's
          # 10GB quota and evicted the Rust caches. Registry storage is free of
          # that quota. GHCR needs OCI media types for the cache manifest.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:buildcache
          # Tag-scoped layer saves are unreadable by the next tag; cache-warm
          # owns the main-scoped layers. Dispatch runs (from main) still save.
          # ignore-error: a cache export hiccup must never fail a release build.
          cache-to: ${{ github.ref_type != 'tag' && format('type=registry,ref=ghcr.io/{0}/{1}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true', github.repository_owner, matrix.image) || '' }}
