services:
  web:
    build:
      context: docker/dev
      dockerfile: web.Dockerfile
    init: true
    command: sh -c "yarn install --frozen-lockfile && exec yarn vite --host 0.0.0.0"
    environment:
      VITE_HUB_API_URL: "http://hub:9500"
      VITE_RELAY_HOST: "localhost"
      VITE_RELAY_PORT: "9443"
      VITE_RELAY_PASSWORD: "forge"
      VITE_FARO_ENABLED: "${VITE_FARO_ENABLED:-false}"
      VITE_FARO_COLLECTOR_URL: "${VITE_FARO_COLLECTOR_URL:-http://localhost:12347/collect}"
      VITE_FARO_ENVIRONMENT: "${VITE_FARO_ENVIRONMENT:-development}"
    ports:
      - "1420:1420"
    volumes:
      - .:/app
      - web-node-modules:/app/node_modules

  relay:
    build:
      context: docker/dev
      dockerfile: rust.Dockerfile
    init: true
    command:
      - watchexec
      - --restart
      - --stop-signal=SIGKILL
      - --watch
      - manabrew-rs/crates/manabrew-server
      - --watch
      - manabrew-rs/crates/manabrew-protocol
      - --watch
      - manabrew-rs/crates/manabrew-relay-protocol
      - --
      - cargo
      - run
      - -p
      - manabrew-server
    environment:
      CARGO_TARGET_DIR: /target
      CARGO_HTTP_TIMEOUT: "600"
      CARGO_HTTP_LOW_SPEED_LIMIT: "1"
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "10"
      FORGE_HOST: "0.0.0.0"
      FORGE_PORT: "9443"
      FORGE_HEALTH_PORT: "9444"
      MANABREW_SERVER_KEY: "forge"
      MANABREW_EVENTS_DIR: "/events"
      DECK_HUB: "1"
      MANABREW_HUB_DECK_PLAYS_URL: "http://hub:9500"
      MANABREW_HUB_JWKS_URL: "http://hub:9500/api/auth/jwks"
      MANABREW_HUB_DECK_PLAYS_TOKEN: "forge"
      SECRET_MANABREW_KEY: "forge-dev"
      RUST_LOG: "manabrew_server=info"
    ports:
      - "9443:9443"
      - "9444:9444"
    volumes:
      - .:/app
      - relay-target:/target
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - ./ops/hub-data/dev/events:/events
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9444/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 600s

  hub:
    build:
      context: docker/dev
      dockerfile: rust.Dockerfile
    init: true
    command:
      - watchexec
      - --restart
      - --watch
      - manabrew-rs/crates/manabrew-hub
      - --watch
      - manabrew-rs/crates/manabrew-protocol
      - --watch
      - manabrew-rs/crates/manabrew-relay-protocol
      - --
      - cargo
      - run
      - -p
      - manabrew-hub
    environment:
      CARGO_TARGET_DIR: /target
      CARGO_HTTP_TIMEOUT: "600"
      CARGO_HTTP_LOW_SPEED_LIMIT: "1"
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "10"
      HUB_HOST: "0.0.0.0"
      HUB_PORT: "9500"
      HUB_DB_PATH: "/data/hub.db"
      HUB_ANALYTICS_IMPORT_DB_PATH: "/events/events.db"
      HUB_RELAY_DECK_PLAYS_TOKEN: "forge"
      SECRET_MANABREW_KEY: "forge-dev"
      HUB_RANKING_REFRESH_SECONDS: "5"
      HUB_PUBLIC_URL: "http://localhost:9500"
      WEB_APP_URL: "http://localhost:1420"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      AUTH_EMAIL_FROM: "${AUTH_EMAIL_FROM:-Manabrew <onboarding@resend.dev>}"
      DECK_HUB: "1"
      # Point these at a MinIO container or a real bucket to exercise avatar and
      # playmat uploads; unset, the hub reports no asset capability.
      HUB_S3_ENDPOINT: "${HUB_S3_ENDPOINT:-}"
      HUB_S3_REGION: "${HUB_S3_REGION:-auto}"
      HUB_S3_BUCKET: "${HUB_S3_BUCKET:-}"
      HUB_S3_ACCESS_KEY_ID: "${HUB_S3_ACCESS_KEY_ID:-}"
      HUB_S3_SECRET_ACCESS_KEY: "${HUB_S3_SECRET_ACCESS_KEY:-}"
      HUB_S3_PUBLIC_BASE_URL: "${HUB_S3_PUBLIC_BASE_URL:-}"
      RUST_LOG: "manabrew_hub=info"
    ports:
      - "9500:9500"
    depends_on:
      events-ingester:
        condition: service_healthy
    volumes:
      - .:/app
      - ./ops/hub-data/dev:/data
      - ./ops/hub-data/dev/events:/events
      - hub-target:/target
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9500/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 600s

  events-ingester:
    image: python:3.12-alpine
    init: true
    command:
      - python
      - /app/ingest-events.py
      - --db
      - /events/events.db
      - --hub-db
      - /hub/hub.db
      - --watch
      - "1"
    volumes:
      - ./scripts/ingest-events.py:/app/ingest-events.py:ro
      - ./ops/hub-data/dev/events:/events
      - ./ops/hub-data/dev:/hub
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sqlite3; sqlite3.connect('/events/events.db').execute('SELECT 1 FROM games LIMIT 1')"
      interval: 2s
      timeout: 2s
      retries: 30

  grafana:
    profiles:
      - observability
    image: grafana/grafana:11.6.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: frser-sqlite-datasource
      DISCORD_WEBHOOK_URL: https://discord.invalid/webhook-not-configured
    ports:
      - "127.0.0.1:${GRAFANA_DEV_PORT:-3000}:3000"
    volumes:
      - ./ops/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./ops/hub-data/dev/events:/var/manabrew/events
      - grafana-dev-data:/var/lib/grafana
    restart: unless-stopped

  loki:
    profiles:
      - observability
    image: grafana/loki:3.5.0
    command:
      - -config.file=/etc/loki/loki.yml
    ports:
      - "127.0.0.1:${LOKI_DEV_PORT:-3100}:3100"
    volumes:
      - ./ops/observability/loki:/etc/loki:ro
      - loki-dev-data:/loki
    restart: unless-stopped
    mem_limit: 384m

  faro-collector:
    profiles:
      - observability
    build:
      context: .
      dockerfile: ops/observability/collector/Dockerfile
    environment:
      FARO_ORIGINS: "http://localhost:1420,http://127.0.0.1:1420"
      FARO_DAILY_BYTES: "${FARO_DAILY_BYTES:-10485760}"
    ports:
      - "127.0.0.1:${FARO_COLLECTOR_DEV_PORT:-12347}:12347"
    volumes:
      - ./target/faro-sourcemaps:/var/lib/faro/sourcemaps:ro
      - faro-dev-data:/var/lib/faro/state
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:12347/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      - loki

  prometheus:
    profiles:
      - observability
    image: prom/prometheus:v3.4.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    ports:
      - "127.0.0.1:${PROMETHEUS_DEV_PORT:-9090}:9090"
    volumes:
      - ./ops/observability/prometheus/dev.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-dev-data:/prometheus
    restart: unless-stopped
    mem_limit: 512m

volumes:
  web-node-modules:
  cargo-registry:
  cargo-git:
  relay-target:
  hub-target:
  grafana-dev-data:
  loki-dev-data:
  faro-dev-data:
  prometheus-dev-data:
