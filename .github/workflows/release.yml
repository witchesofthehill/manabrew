name: Release

# Watches `main` for Conventional Commits, opens/updates a "Release PR" that
# bumps the version in package.json, src-tauri/tauri.conf.json and
# src-tauri/Cargo.toml plus regenerates CHANGELOG.md. Merging that PR creates
# a `vX.Y.Z` tag + GitHub Release; the existing `release-artifacts.yml`
# workflow then builds the macOS .dmg / Windows .exe and attaches them to
# that same release.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Run release-please
    # Lightweight GitHub-API job; keep it off the self-hosted runner so it does
    # not compete with deploys/builds on that box (a likely cause of flaky
    # "Error creating commit" failures).
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      pr_branch: ${{ steps.rp.outputs.pr && fromJSON(steps.rp.outputs.pr).headBranchName || '' }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

  # release-please pushes the vX.Y.Z tag using GITHUB_TOKEN, which by design
  # does not trigger downstream workflows. Dispatch release-artifacts.yml
  # explicitly on the new tag ref so the macOS/Windows builds + Discord
  # release notification fire.
  dispatch-artifacts:
    name: Dispatch release-artifacts on new tag
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger release-artifacts workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh workflow run release-artifacts.yml --ref "$TAG"

  # release-please bumps the crate version in src-tauri/Cargo.toml but cannot
  # update the workspace Cargo.lock, so the lockfile's `manabrew` entry goes
  # stale and the next `cargo` run dirties the tree. main is protected, so the
  # fix rides along inside the release PR: re-sync Cargo.lock on that branch
  # (pushed with GITHUB_TOKEN, which does not retrigger workflows) so it merges
  # with the version bump. release-please force-pushes its branch each run, so
  # this re-applies every time it refreshes the PR.
  sync-lockfile:
    name: Sync Cargo.lock in the release PR
    needs: release-please
    if: needs.release-please.outputs.pr_branch != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.pr_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Re-sync Cargo.lock with the bumped versions
        run: cargo metadata --format-version 1 >/dev/null
      - name: Commit the lockfile if it changed
        env:
          BRANCH: ${{ needs.release-please.outputs.pr_branch }}
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already in sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: sync Cargo.lock"
          git push origin "HEAD:$BRANCH"
