[package]
name = "manabot"
version = "0.11.7"
edition = "2021"
license.workspace = true
description = "AI bot player for the manabrew engine"

[features]
default = ["native"]
native = ["dep:tokio", "dep:tokio-tungstenite", "dep:futures-util", "dep:manabrew-net"]

[dependencies]
manabrew-agent-interface = { path = "../manabrew-agent-interface", version = "0.10.10" }
manabrew-engine = { path = "../manabrew-engine", version = "0.8.2" }
manabrew-protocol = { path = "../manabrew-protocol", version = "5.6.0" }
manabrew-net = { path = "../manabrew-net", version = "0.1.0", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
futures-util = { version = "0.3", optional = true }
tokio = { version = "1", features = ["rt", "macros", "net", "sync", "time"], optional = true }
tokio-tungstenite = { version = "0.24", features = ["native-tls"], optional = true }
tracing = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console", "Window", "Storage"] }
