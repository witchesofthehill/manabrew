name: Release

# Continuous deployment: every push to `main` runs semantic-release, which
# analyses Conventional Commits, bumps the version across package.json /
# src-tauri/tauri.conf.json / src-tauri/Cargo.toml / Cargo.lock (via
# scripts/set-version.mjs), regenerates CHANGELOG.md, commits that back to
# `main`, and cuts a `vX.Y.Z` tag + GitHub Release. The tag is pushed with
# RELEASE_PAT_TOKEN (a fine-grained PAT) so it cascades to
# release-artifacts.yml, which builds the macOS .dmg / Windows .exe and
# attaches them to the release. That PAT needs Contents: read/write and must
# be allowed to bypass branch protection on `main` (it pushes the release
# commit directly). The default GITHUB_TOKEN can't stand in here: tags it
# pushes do not trigger downstream workflows, and it can't push to protected
# `main`.
#
# The `if` guard skips the run triggered by semantic-release's own
# `chore(release):` commit. We deliberately do NOT put `[skip ci]` in that
# commit message: the new tag points at that commit, so `[skip ci]` would also
# suppress the tag-triggered installer builds in release-artifacts.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: semantic-release
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.RELEASE_PAT_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT_TOKEN }}
        run: npx semantic-release
