global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: relay
    static_configs:
      - targets: ["relay:9444"]

  - job_name: faro-collector
    static_configs:
      - targets: ["faro-collector:12347"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
