apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100

  - name: Events
    uid: events-sqlite
    type: frser-sqlite-datasource
    jsonData:
      path: /var/manabrew/events/events.db

  - name: Client first observed match
    uid: client-funnel-sqlite
    type: frser-sqlite-datasource
    editable: false
    jsonData:
      path: /var/manabrew/client-funnel/client-funnel.db
      pathOptions: "mode=ro&_pragma=query_only(1)&_pragma=busy_timeout(1000)"
      attachLimit: 0
