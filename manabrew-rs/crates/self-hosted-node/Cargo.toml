[package]
name = "self-hosted-node"
version = "0.27.2"
edition = "2021"
license.workspace = true
description = "Headless manabrew engine node for hosting AI games"

[features]
java-forge = []
graal-forge = []
# The iroh data plane. Off by default so the fleet image carries no QUIC stack
# and no second listening socket until the transport is deliberately enabled;
# `MANABREW_IROH` still has to be set on top of it. See docs/TRANSPORT.md.
iroh = ["dep:manabrew-net", "manabot/iroh"]

[lib]
name = "self_hosted_node"
path = "src/lib.rs"

[[bin]]
name = "self-hosted-node"
path = "src/main.rs"

[dependencies]
manabrew-relay-protocol = { path = "../manabrew-relay-protocol", version = "5.8.2" }
manabrew-net = { path = "../manabrew-net", version = "0.1.0", optional = true }
manabrew-agent-interface = { path = "../manabrew-agent-interface", version = "0.10.11" }
manabrew-protocol = { path = "../manabrew-protocol", version = "5.6.1" }
manabot = { path = "../manabot/", version = "0.11.9" }
forge-carddb = { path = "../forge-carddb", version = "0.3.1" }
manabrew-engine = { path = "../manabrew-engine", version = "0.8.2" }
forge-foundation = { path = "../forge-foundation", version = "0.3.3" }
manabrew_game_runtime = { path = "../manabrew-game-runtime", version = "0.3.40" }
memmap2 = "0.9"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
metrics = "0.24"
# no-tls-provider: keeps aws-lc-rs (cmake) out of the tree; ring is installed at metrics init
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["push-gateway-no-tls-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[dev-dependencies]
iroh = "1.1"
