[package]
name = "manabrew-net"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Direct data-plane transport for manabrew rooms: iroh endpoints, room gossip, session framing"
publish = false

[dependencies]
manabrew-relay-protocol = { path = "../manabrew-relay-protocol", version = "5.8.1" }
# Minimal on purpose. No address lookup is configured (the relay supplies every
# peer's address), so the pkarr/DNS resolvers and their HTTP client are dead
# weight, and they are most of the browser bundle.
iroh = { version = "1.1", default-features = false, features = ["tls-ring"] }
n0-future = "0.3"
iroh-gossip = { version = "0.101", default-features = false, features = ["net"] }
blake3 = "1"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
# Hole punching and metrics are native-only concerns.
iroh = { version = "1.1", default-features = false, features = ["portmapper", "metrics"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
iroh-relay = { version = "1.1", features = ["server"] }
