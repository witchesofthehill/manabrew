[package]
name = "manabrew-server"
version = "0.26.0"
edition = "2021"
license.workspace = true
description = "Matchmaking and lobby relay server for manabrew multiplayer"

[[bin]]
name = "manabrew-server"
path = "src/main.rs"

[dependencies]
manabrew-protocol = { path = "../manabrew-protocol", version = "5.6.0" }
manabrew-relay-protocol = { path = "../manabrew-relay-protocol", version = "5.8.1" }
# The iroh relay this deployment runs, in-process. `server` is the only feature
# that matters; TLS is left to the edge, which already terminates it.
iroh-relay = { version = "1.1", features = ["server"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { version = "1", features = ["v4"] }
dashmap = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
socket2 = "0.5"
axum = "0.7"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
zstd = "0.13"
aws-lc-rs = "1"
base64 = "0.22"
sha2 = "0.10"
