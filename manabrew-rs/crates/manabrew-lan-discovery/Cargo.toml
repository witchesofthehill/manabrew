[package]
name = "manabrew-lan-discovery"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "mDNS advertise and browse, so nobody types an address to find a manabrew relay or room on their network"

[dependencies]
serde = { workspace = true }
mdns-sd = "0.21"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
