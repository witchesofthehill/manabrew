name: manabrew-arcana

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_SCRYFALL_SYMBOL_BASE: /scryfall-symbols/
        VITE_HOSTED_AI_ENABLED: "true"
    image: manabrew-arcana/web:dev
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      RELAY_HOST: "${RELAY_HOST:-localhost}"
      RELAY_PORT: "${RELAY_PORT:-8781}"
      RELAY_PASSWORD: "${MANABREW_SERVER_KEY:?MANABREW_SERVER_KEY is required}"
      HOSTED_AI_ENABLED: "true"
      ACCOUNTS: "1"
      HUB_API_URL: "${WEB_APP_URL:-http://localhost:8780}"
    volumes:
      - ./ops/arcana/web.Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${WEB_PORT:-8780}:80"
    depends_on:
      relay:
        condition: service_healthy
      hub:
        condition: service_healthy

  relay:
    build:
      context: .
      dockerfile: manabrew-rs/crates/manabrew-server/Dockerfile
    image: manabrew-arcana/relay:dev
    restart: unless-stopped
    environment:
      FORGE_HOST: "0.0.0.0"
      FORGE_PORT: "9443"
      FORGE_HEALTH_PORT: "9444"
      FORGE_MAX_ROOMS: "20"
      MANABREW_SERVER_KEY: "${MANABREW_SERVER_KEY:?MANABREW_SERVER_KEY is required}"
      MANABREW_HUB_JWKS_URL: "http://hub:9500/api/auth/jwks"
      RUST_LOG: "manabrew_server=info"
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${RELAY_PORT:-8781}:9443"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9444/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      hub:
        condition: service_healthy

  hub:
    build:
      context: .
      dockerfile: manabrew-rs/crates/manabrew-hub/Dockerfile
    image: manabrew-arcana/hub:dev
    restart: unless-stopped
    environment:
      HUB_HOST: "0.0.0.0"
      HUB_PORT: "9500"
      HUB_DB_PATH: "/var/manabrew/hub/hub.db"
      HUB_PUBLIC_URL: "${WEB_APP_URL:-http://localhost:8780}"
      WEB_APP_URL: "${WEB_APP_URL:-http://localhost:8780}"
      RUST_LOG: "manabrew_hub=info"
    volumes:
      - ./ops/hub-data/arcana:/var/manabrew/hub
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9500/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  node:
    build:
      context: .
      dockerfile: manabrew-rs/crates/self-hosted-node/Dockerfile
    image: manabrew-arcana/node:dev
    restart: unless-stopped
    environment:
      SELF_HOSTED_NODE_RELAY_URL: "ws://relay:9443"
      SELF_HOSTED_NODE_SERVER_KEY: "${MANABREW_SERVER_KEY:?MANABREW_SERVER_KEY is required}"
      SELF_HOSTED_NODE_FORMAT: "Any"
      SELF_HOSTED_NODE_MAX_PLAYERS: "4"
      SELF_HOSTED_NODE_MAX_GAMES: "${SELF_HOSTED_NODE_MAX_GAMES:-2}"
      SELF_HOSTED_NODE_SHARED_ISOLATE: "1"
      SELF_HOSTED_NODE_STATE_DELTA: "1"
      SELF_HOSTED_NODE_MANIFEST_URL: "http://127.0.0.1:1/manifest.json"
      RUST_LOG: "self_hosted_node=info"
    mem_limit: 4g
    depends_on:
      relay:
        condition: service_healthy
