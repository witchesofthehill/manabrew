name: Publish protocol

# Publishes the wire protocol to both registries from a single source of truth:
# the Rust crate `manabrew-protocol` to crates.io, and the TypeScript types it
# generates (`@manabrew/protocol`) to npm — always at the same version.
#
# Triggers:
#   workflow_call     — release.yml calls this after a release that bumped the
#                       protocol crate (the real publish).
#   pull_request      — a PR touching the protocol publishes a throwaway
#                       prerelease (`<version>-pr.<pr>.<run>`, npm dist-tag
#                       `pr`) so the pipeline is exercised end to end. These are
#                       real registry entries; prune them by hand.
#   workflow_dispatch — manual real publish.
#
# Both publishes are idempotent: a version already on the registry is skipped,
# so this is safe to run whenever (crates.io publishes are also driven by
# `cargo xtask publish` on every release — whichever runs first wins, the other
# skips).

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - "manabrew-rs/crates/manabrew-protocol/**"
      - "packages/protocol/**"
      - ".github/workflows/publish-protocol.yml"

permissions:
  contents: read

concurrency:
  group: publish-protocol-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: crates.io + npm
    runs-on: ubuntu-latest
    if: github.repository == 'witchesofthehill/manabrew'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: engine

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # On a PR the crate version becomes a unique prerelease so the real
      # (release) version is never claimed by a test run.
      - name: Compute version
        id: ver
        run: |
          set -euo pipefail
          CRATE_VERSION=$(grep -m1 '^version' manabrew-rs/crates/manabrew-protocol/Cargo.toml \
            | sed -E 's/version *= *"([^"]+)".*/\1/')
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            VERSION="${CRATE_VERSION}-pr.${{ github.event.pull_request.number }}.${{ github.run_number }}"
            echo "npm_tag=pr" >> "$GITHUB_OUTPUT"
            echo "dummy=true" >> "$GITHUB_OUTPUT"
          else
            VERSION="$CRATE_VERSION"
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
            echo "dummy=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing manabrew-protocol / @manabrew/protocol @ $VERSION"

      # gen-protocol stamps CARGO_PKG_VERSION into version.ts, so the crate
      # version must be set before generating.
      - name: Stamp prerelease version into the crate (PR only)
        if: steps.ver.outputs.dummy == 'true'
        run: |
          sed -i -E "0,/^version = \"[^\"]+\"/s//version = \"${{ steps.ver.outputs.version }}\"/" \
            manabrew-rs/crates/manabrew-protocol/Cargo.toml

      - name: Generate TypeScript bindings
        run: cargo run -q -p manabrew-protocol --bin gen-protocol -- packages/protocol/src

      - name: Build npm package
        working-directory: packages/protocol
        run: |
          npm version "${{ steps.ver.outputs.version }}" --no-git-tag-version --allow-same-version
          npm install
          npm run build

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          if curl -sf -o /dev/null \
            -A "manabrew-ci (github.com/witchesofthehill/manabrew)" \
            "https://crates.io/api/v1/crates/manabrew-protocol/$V"; then
            echo "manabrew-protocol $V already on crates.io — skip"
          else
            EXTRA=""
            [ "${{ steps.ver.outputs.dummy }}" = "true" ] && EXTRA="--allow-dirty"
            cargo publish -p manabrew-protocol --no-verify $EXTRA
          fi

      - name: Publish to npm
        working-directory: packages/protocol
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          if npm view "@manabrew/protocol@$V" version >/dev/null 2>&1; then
            echo "@manabrew/protocol $V already on npm — skip"
          else
            npm publish --tag "${{ steps.ver.outputs.npm_tag }}"
          fi
