# Staging stack — tracks the `staging` branch, runs on the PRODUCTION box under
# /opt/manabrew-staging and joins the prod docker network so the prod Caddy
# (ops/Caddyfile) fronts it at staging.manabrew.app / relay-staging.manabrew.app.
# Driven by .github/workflows/staging-deploy.yml over direct SSH via
# `cargo xtask deploy --staging` from the runner.
#
# No published ports: prod Caddy owns 80/443 on the box. Every service name
# carries a -staging suffix because it shares docker DNS with the prod project.
# Secrets come from /opt/manabrew-staging/.env, written by the workflow's
# secret sync — never from prod's ops/production.secrets.
services:
  manabrew-staging:
    image: ghcr.io/witchesofthehill/manabrew-web:${MANABREW_IMAGE_TAG:-staging}
    restart: unless-stopped
    environment:
      HUB_ADMIN_PASSWORD_HASH:
      RELAY_HOST: "relay-staging.manabrew.app"
      RELAY_PORT: "443"
      RELAY_PASSWORD: "${MANABREW_SERVER_KEY:?MANABREW_SERVER_KEY is required}"
      HOSTED_AI_ENABLED: "${HOSTED_AI_ENABLED:-true}"
      DESIGN_SYSTEM: "${DESIGN_SYSTEM:-1}"
      ACCOUNTS: "${ACCOUNTS:-1}"
      DECK_HUB: "${DECK_HUB:-1}"
      EMAIL_SIGN_IN: "${EMAIL_SIGN_IN:-1}"
      # Hub API is same-origin (path-routed in ops/staging.Caddyfile).
      HUB_API_URL: "https://staging.manabrew.app"
    expose:
      - "80"
    volumes:
      - ./ops/staging.Caddyfile:/etc/caddy/Caddyfile:ro
    mem_limit: 128m
    depends_on:
      manabrew-server-staging:
        condition: service_healthy
      staging-data-migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/api/hub/capabilities"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  manabrew-server-staging:
    image: ghcr.io/witchesofthehill/manabrew-server:${MANABREW_IMAGE_TAG:-staging}
    environment:
      FORGE_HOST: "0.0.0.0"
      FORGE_PORT: "9443"
      FORGE_HEALTH_PORT: "9444"
      FORGE_MAX_ROOMS: "100"
      MANABREW_SERVER_KEY: "${MANABREW_SERVER_KEY:?MANABREW_SERVER_KEY is required}"
      DECK_HUB: "${DECK_HUB:-1}"
      MANABREW_HUB_DECK_PLAYS_URL: "http://manabrew-hub-staging:9500"
      MANABREW_HUB_DECK_PLAYS_TOKEN: "${MANABREW_SERVER_KEY:?MANABREW_SERVER_KEY is required}"
      SECRET_MANABREW_KEY: "${SECRET_MANABREW_KEY:-}"
      MANABREW_EVENTS_DIR: "/var/manabrew/events"
      RUST_LOG: "manabrew_server=info"
    volumes:
      - ./ops/events:/var/manabrew/events
    expose:
      - "9443"
      - "9444"
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9444/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      manabrew-hub-staging:
        condition: service_healthy

  manabrew-hub-staging:
    image: ghcr.io/witchesofthehill/manabrew-hub:${MANABREW_IMAGE_TAG:-staging}
    environment:
      HUB_HOST: "0.0.0.0"
      HUB_PORT: "9500"
      # Own throwaway DB inside the staging tree — never prod's hub.db.
      HUB_DB_PATH: "/var/manabrew/hub/hub.db"
      HUB_ANALYTICS_IMPORT_DB_PATH: "/var/manabrew/events/events.db"
      HUB_RELAY_DECK_PLAYS_TOKEN: "${MANABREW_SERVER_KEY:?MANABREW_SERVER_KEY is required}"
      HUB_RANKING_REFRESH_SECONDS: "5"
      DECK_HUB: "${DECK_HUB:-1}"
      RUST_LOG: "manabrew_hub=info"
      HUB_PUBLIC_URL: "https://staging.manabrew.app"
      WEB_APP_URL: "https://staging.manabrew.app"
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:-}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET:-}"
      DISCORD_CLIENT_ID: "${DISCORD_CLIENT_ID:-}"
      DISCORD_CLIENT_SECRET: "${DISCORD_CLIENT_SECRET:-}"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      # The Resend key is scoped to the verified mail.manabrew.app domain; the
      # compiled default sender uses the bare domain and gets a 403.
      AUTH_EMAIL_FROM: "${AUTH_EMAIL_FROM:-Manabrew <login@mail.manabrew.app>}"
    volumes:
      - ./ops/hub-data:/var/manabrew/hub
      - ./ops/events:/var/manabrew/events
    expose:
      - "9500"
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      events-ingester-staging:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9500/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  events-ingester-staging:
    image: python:3.12-alpine
    command:
      - python
      - /app/ingest-events.py
      - --dir
      - /var/manabrew/events
      - --watch
      - "300"
    volumes:
      - ./scripts/ingest-events.py:/app/ingest-events.py:ro
      - ./ops/events:/var/manabrew/events
    restart: unless-stopped
    mem_limit: 64m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sqlite3; sqlite3.connect('/var/manabrew/events/events.db').execute('SELECT 1 FROM games LIMIT 1')"
      interval: 5s
      timeout: 3s
      retries: 12

  staging-data-migrations:
    image: python:3.12-alpine
    command:
      - python
      - -c
      - |
        import pathlib
        import sqlite3
        connection = sqlite3.connect("/var/manabrew/hub/hub.db", timeout=30)
        connection.executescript(pathlib.Path("/migrations/001_top_deck_filler.sql").read_text())
        connection.close()
    volumes:
      - ./ops/hub-data:/var/manabrew/hub
      - ./ops/staging-migrations:/migrations:ro
    depends_on:
      manabrew-hub-staging:
        condition: service_healthy
    restart: "no"
    mem_limit: 64m

  self-hosted-node-staging:
    profiles:
      - hosted-ai
    image: ghcr.io/witchesofthehill/manabrew-node:${MANABREW_IMAGE_TAG:-staging}
    environment:
      SELF_HOSTED_NODE_RELAY_URL: "ws://manabrew-server-staging:9443"
      SELF_HOSTED_NODE_SERVER_KEY: "${MANABREW_SERVER_KEY:?MANABREW_SERVER_KEY is required}"
      # Play-vs-AI pool rooms must advertise format Any (the client's
      # findHostedRoom only matches Any) and enough seats for commander pods.
      SELF_HOSTED_NODE_FORMAT: "${SELF_HOSTED_NODE_FORMAT:-Any}"
      SELF_HOSTED_NODE_MAX_PLAYERS: "${SELF_HOSTED_NODE_MAX_PLAYERS:-4}"

      SELF_HOSTED_NODE_MAX_GAMES: "${SELF_HOSTED_NODE_MAX_GAMES:-1}"
      RUST_LOG: "self_hosted_node=info"
    mem_limit: 1g
    cpu_shares: 512
    depends_on:
      - manabrew-server-staging
    restart: unless-stopped

networks:
  default:
    external: true
    name: manabrew_default
