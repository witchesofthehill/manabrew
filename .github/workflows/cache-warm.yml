name: Cache warm

# build-checks.yml only runs on pull_request, and Actions caches saved from a
# PR run are scoped to that PR's branch — invisible to every other PR. Nothing
# else compiles on main, so without this workflow the first push of every PR
# starts from a cold cache. Each job here mirrors the build commands and
# rust-cache shared-key of a build-checks job (or a publish.yml job for the
# desktop tauri keys) and saves main-scoped caches, which every PR run (and
# every tag build) can restore. publish.yml itself is restore-only.
#
# Steady-state cost is low: every job is gated on whether its inputs actually
# changed in the pushed commit (a UI-only merge warms nothing), rust-cache
# skips saving when its key (toolchain + lockfile) already has an entry, and
# release bump commits — which only move version numbers — are skipped
# entirely. The weekly schedule re-runs everything unconditionally so the
# caches never hit GitHub's 7-day unused-entry eviction.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC — keepalive against cache eviction
  workflow_dispatch:

permissions:
  contents: read

# Never cancel an in-progress warm: every merge is followed ~90s later by its
# chore(release) push, which would kill the real warm and then skip all jobs.
concurrency:
  group: cache-warm
  cancel-in-progress: false

jobs:
  # What changed in this push decides which warms are worth running. The
  # docker warms only feed reusable *dependency* layers (chef cooks, yarn
  # install) — PR previews and release commits have different sources, so
  # main's final compile layers never transfer — hence the docker gate only
  # watches manifests/lockfiles/Dockerfiles, not source trees. Non-push runs
  # (schedule, dispatch) warm everything.
  changes:
    name: Changed inputs
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      docker: ${{ steps.scope.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Classify pushed changes
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "push" ] || ! git rev-parse --verify -q HEAD^ >/dev/null; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "docker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rust=false
          docker=false
          while IFS= read -r f; do
            case "$f" in
              manabrew-rs/*|Cargo.toml|Cargo.lock|forge|src-tauri/*|tree-sitter-forge-card-script/*|xtask/*|public/preset_decks/*|.github/workflows/cache-warm.yml)
                rust=true ;;
            esac
            case "$f" in
              Cargo.toml|Cargo.lock|package.json|yarn.lock|*Dockerfile*|.dockerignore|.github/workflows/cache-warm.yml)
                docker=true ;;
            esac
          done < <(git diff --name-only HEAD^ HEAD)
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "docker=$docker" >> "$GITHUB_OUTPUT"

  # The GHCR layer cache is not ref-scoped the way the Actions cache was, so
  # every ref reads the same `:buildcache`. This job still runs first on main
  # so the cargo-chef dependency cooks are warm before anything needs them.
  # `push: false`: this only populates the cache. The cook layers sit before
  # the VITE_* ARGs in Dockerfile.web, so one warm serves the prod, staging
  # and preview arg variants alike. Ironsmith stays dark (mirrors the
  # docker-images.yml default; its stage caches on its own sources anyway).
  docker-layers:
    name: Warm ${{ matrix.image }} layers
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Overrides the workflow-level `contents: read`: the layer cache now lives
    # in GHCR, so warming it is a package write even though no image is pushed.
    permissions:
      contents: read
      packages: write
    needs: changes
    if: needs.changes.outputs.docker == 'true' && !startsWith(github.event.head_commit.message, 'chore(release):')
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: manabrew-server
            dockerfile: manabrew-rs/crates/manabrew-server/Dockerfile
          - image: manabrew-web
            dockerfile: Dockerfile.web
          - image: manabrew-node
            dockerfile: manabrew-rs/crates/self-hosted-node/Dockerfile
          - image: manabrew-hub
            dockerfile: manabrew-rs/crates/manabrew-hub/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The image itself is never pushed here, but the layer cache is, so this
      # job still needs registry credentials.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (cache only, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true

  engine:
    name: Warm engine & parity
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: changes
    if: needs.changes.outputs.rust == 'true' && !startsWith(github.event.head_commit.message, 'chore(release):')
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Default-ld swap: no RUSTFLAGS change, caches stay compatible. Keep
      # in sync with build-checks.yml.
      - name: Set up mold linker
        uses: rui314/setup-mold@v1

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: engine

      - name: Build engine crates + parity (release)
        run: >
          cargo build --release
          -p forge-foundation
          -p forge-carddb
          -p manabrew-engine
          -p manabrew-agent-interface
          -p parity --features parity/serve

      - name: Build engine test artifacts
        run: cargo test --release -pmanabrew-engine  --lib --no-run

  relay:
    name: Warm relay & node
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: changes
    if: needs.changes.outputs.rust == 'true' && !startsWith(github.event.head_commit.message, 'chore(release):')
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up mold linker
        uses: rui314/setup-mold@v1

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: relay

      - name: Build cardset archive
        run: cargo run -p forge-cardset-archive --features build --release --bin build-cardset-archive

      - name: Build relay and node
        run: cargo build --release -p manabrew-server -p self-hosted-node

      - name: Build networking test artifacts
        run: cargo test --release -p networking-tests --test networking_regression --no-run

  web-wasm:
    name: Warm wasm & xtask
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: changes
    if: needs.changes.outputs.rust == 'true' && !startsWith(github.event.head_commit.message, 'chore(release):')
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Install Yarn
        run: npm install --global yarn

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Set up mold linker
        uses: rui314/setup-mold@v1

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: web-wasm

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1

      - run: yarn

      # Same key recipe as build-checks' typescript job — keep them in sync so
      # PR runs hit the cache warmed here.
      - name: Compute wasm output key
        id: wasm-key
        shell: bash
        run: echo "key=wasm-output-$(git rev-parse HEAD:forge)-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'manabrew-rs/**/*.rs', 'manabrew-rs/**/Cargo.toml', 'scripts/build-wasm.mjs') }}" >> "$GITHUB_OUTPUT"

      - name: Wasm output cache
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: |
            src/wasm
            public/wasm
          key: ${{ steps.wasm-key.outputs.key }}

      - name: Build wasm + cardset archive
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: yarn build:wasm

      - name: Warm xtask (gen:types)
        run: yarn gen:types

  # publish.yml restores these tauri-* keys but can never save them anywhere
  # readable, so releases built cold. Desktop mirrors publish with dist stubbed.
  tauri-macos:
    name: Warm macOS tauri
    runs-on: macos-latest
    timeout-minutes: 90
    needs: changes
    if: needs.changes.outputs.rust == 'true' && !startsWith(github.event.head_commit.message, 'chore(release):')
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Set up GraalVM (JDK 21)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "21"
          distribution: "graalvm-community"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: "maven"

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tauri-macos

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1

      - run: yarn

      # Mirrors what scripts/ensure-wasm.mjs hashes (its own stamp can't be
      # used here: it hashes card-data mtimes, which a fresh checkout always
      # changes). The forge gitlink stands in for the card-data dirs.
      - name: Compute wasm output key
        id: wasm-key
        shell: bash
        run: echo "key=wasm-output-$(git rev-parse HEAD:forge)-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'manabrew-rs/**/*.rs', 'manabrew-rs/**/Cargo.toml', 'scripts/build-wasm.mjs') }}" >> "$GITHUB_OUTPUT"

      - name: Wasm output cache
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: |
            src/wasm
            public/wasm
          key: ${{ steps.wasm-key.outputs.key }}

      - name: Build WASM + bundle cards
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: yarn build:wasm

      - name: Harness cache keys
        id: harness-keys
        shell: bash
        run: |
          echo "jar=$(node scripts/harness.mjs checksum)" >> "$GITHUB_OUTPUT"
          echo "native=$(node scripts/harness.mjs native-checksum)" >> "$GITHUB_OUTPUT"

      # The generated protocol sources ship with the jar: they sit under
      # forge-harness/src, so computeChecksum() hashes them. Without them the
      # stored checksum can never match a key computed before codegen, and
      # ensure:harness rebuilds on every run.
      - name: Cache Forge harness jar
        uses: actions/cache@v4
        with:
          path: |
            forge-harness/target/forge-harness-jar-with-dependencies.jar
            forge-harness/target/.harness-sources-checksum
            forge-harness/src/main/java/forge/harness/protocol
          key: harness-jar-v2-${{ steps.harness-keys.outputs.jar }}

      # The key is the only guard against a stale library here: `ensure:harness`
      # re-checks the jar at runtime, but nothing revalidates this artifact.
      - name: Cache Forge native library
        id: forge-native-cache
        uses: actions/cache@v4
        with:
          path: forge-harness/native/build
          key: forge-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.harness-keys.outputs.native }}

      - name: Build Forge harness jar (Maven, GraalVM JDK 21)
        run: yarn ensure:harness

      - name: Build native Forge library (GraalVM native-image)
        if: steps.forge-native-cache.outputs.cache-hit != 'true'
        run: ./forge-harness/build-native.sh

      # Proves the library actually runs, not merely that it exists: a cache hit
      # restores forge-harness/native/build without anything else exercising it.
      - name: Smoke the Forge native library
        env:
          SELF_HOSTED_NODE_GRAAL_SMOKE: "1"
          RUST_LOG: self_hosted_node=info
        run: cargo run -p self-hosted-node --features graal-forge

      - name: Stub frontend dist for tauri context macro
        run: |
          mkdir -p dist
          printf '<!doctype html><title>ci</title>' > dist/index.html

      - name: Build tauri crate with forge-room feature
        run: cargo build --release -p manabrew --features forge-room

  tauri-windows:
    name: Warm Windows tauri
    runs-on: windows-latest
    timeout-minutes: 90
    needs: changes
    if: needs.changes.outputs.rust == 'true' && !startsWith(github.event.head_commit.message, 'chore(release):')
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Set up GraalVM (JDK 21)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "21"
          distribution: "graalvm-community"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: "maven"

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tauri-windows

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1

      - run: yarn

      # Mirrors what scripts/ensure-wasm.mjs hashes (its own stamp can't be
      # used here: it hashes card-data mtimes, which a fresh checkout always
      # changes). The forge gitlink stands in for the card-data dirs.
      - name: Compute wasm output key
        id: wasm-key
        shell: bash
        run: echo "key=wasm-output-$(git rev-parse HEAD:forge)-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'manabrew-rs/**/*.rs', 'manabrew-rs/**/Cargo.toml', 'scripts/build-wasm.mjs') }}" >> "$GITHUB_OUTPUT"

      - name: Wasm output cache
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: |
            src/wasm
            public/wasm
          key: ${{ steps.wasm-key.outputs.key }}

      - name: Build WASM + bundle cards
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: yarn build:wasm

      - name: Harness cache keys
        id: harness-keys
        shell: bash
        run: |
          echo "jar=$(node scripts/harness.mjs checksum)" >> "$GITHUB_OUTPUT"
          echo "native=$(node scripts/harness.mjs native-checksum)" >> "$GITHUB_OUTPUT"

      # The generated protocol sources ship with the jar: they sit under
      # forge-harness/src, so computeChecksum() hashes them. Without them the
      # stored checksum can never match a key computed before codegen, and
      # ensure:harness rebuilds on every run.
      - name: Cache Forge harness jar
        uses: actions/cache@v4
        with:
          path: |
            forge-harness/target/forge-harness-jar-with-dependencies.jar
            forge-harness/target/.harness-sources-checksum
            forge-harness/src/main/java/forge/harness/protocol
          key: harness-jar-v2-${{ steps.harness-keys.outputs.jar }}

      # The key is the only guard against a stale library here: `ensure:harness`
      # re-checks the jar at runtime, but nothing revalidates this artifact.
      - name: Cache Forge native library
        id: forge-native-cache
        uses: actions/cache@v4
        with:
          path: forge-harness/native/build
          key: forge-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.harness-keys.outputs.native }}

      - name: Build Forge harness jar (Maven, GraalVM JDK 21)
        run: yarn ensure:harness

      - name: Build native Forge library (GraalVM native-image)
        if: steps.forge-native-cache.outputs.cache-hit != 'true'
        run: ./forge-harness/build-native.ps1
        shell: pwsh

      # Proves the library actually runs, not merely that it exists: a cache hit
      # restores forge-harness/native/build without anything else exercising it.
      - name: Smoke the Forge native library
        env:
          SELF_HOSTED_NODE_GRAAL_SMOKE: "1"
          RUST_LOG: self_hosted_node=info
        run: cargo run -p self-hosted-node --features graal-forge

      - name: Stub frontend dist for tauri context macro
        shell: bash
        run: |
          mkdir -p dist
          printf '<!doctype html><title>ci</title>' > dist/index.html

      - name: Build tauri crate with forge-room feature
        run: cargo build --release -p manabrew --features forge-room

  tauri-ios:
    name: Warm iOS tauri
    # Pinned to macos-15 like publish.yml's ios-ipa (tauri-apps/tauri#15066).
    runs-on: macos-15
    timeout-minutes: 90
    needs: changes
    if: needs.changes.outputs.rust == 'true' && !startsWith(github.event.head_commit.message, 'chore(release):')
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Install Yarn
        run: npm install --global yarn

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,wasm32-unknown-unknown

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tauri-ios

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1

      - run: yarn

      # Mirrors what scripts/ensure-wasm.mjs hashes (its own stamp can't be
      # used here: it hashes card-data mtimes, which a fresh checkout always
      # changes). The forge gitlink stands in for the card-data dirs.
      - name: Compute wasm output key
        id: wasm-key
        shell: bash
        run: echo "key=wasm-output-$(git rev-parse HEAD:forge)-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'manabrew-rs/**/*.rs', 'manabrew-rs/**/Cargo.toml', 'scripts/build-wasm.mjs') }}" >> "$GITHUB_OUTPUT"

      - name: Wasm output cache
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: |
            src/wasm
            public/wasm
          key: ${{ steps.wasm-key.outputs.key }}

      - name: Build WASM + bundle cards
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: yarn build:wasm

      - name: Build cardset archive
        run: |
          cargo run -p forge-cardset-archive --features build --release \
            --bin build-cardset-archive

      - name: Tauri build (iOS, unsigned)
        run: yarn tauri ios build --no-sign

  tauri-android:
    name: Warm Android tauri
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: changes
    if: needs.changes.outputs.rust == 'true' && !startsWith(github.event.head_commit.message, 'chore(release):')
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Install Yarn
        run: npm install --global yarn

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,wasm32-unknown-unknown

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tauri-android

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1

      - run: yarn

      # Mirrors what scripts/ensure-wasm.mjs hashes (its own stamp can't be
      # used here: it hashes card-data mtimes, which a fresh checkout always
      # changes). The forge gitlink stands in for the card-data dirs.
      - name: Compute wasm output key
        id: wasm-key
        shell: bash
        run: echo "key=wasm-output-$(git rev-parse HEAD:forge)-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'manabrew-rs/**/*.rs', 'manabrew-rs/**/Cargo.toml', 'scripts/build-wasm.mjs') }}" >> "$GITHUB_OUTPUT"

      - name: Wasm output cache
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: |
            src/wasm
            public/wasm
          key: ${{ steps.wasm-key.outputs.key }}

      - name: Build WASM + bundle cards
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: yarn build:wasm

      - name: Build cardset archive
        run: |
          cargo run -p forge-cardset-archive --features build --release \
            --bin build-cardset-archive

      - name: Tauri build (Android APK, arm64)
        run: node scripts/mobile-dev.mjs android build --apk --target aarch64
