[package]
name = "forge-limited"
version = "0.3.0"
edition = "2021"
publish = false

[dependencies]
forge-foundation = { path = "../forge-foundation" }
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true }
rand = "0.8"
rand_chacha = { version = "0.3", features = ["serde1"] }
thiserror = "1"
bitflags = { version = "2", features = ["serde"] }
