[package]
name = "manabrew-hub"
version = "0.15.1"
edition = "2021"
license.workspace = true
description = "Accounts, decks, and Community API for manabrew"

[features]
default = ["server"]
server = [
    "dep:axum",
    "dep:tokio",
    "dep:tower-http",
    "dep:rusqlite",
    "dep:serde_json",
    "dep:uuid",
    "dep:sha2",
    "dep:rand",
    "dep:chrono",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:reqwest",
    "dep:maud",
    "dep:aws-lc-rs",
    "dep:base64",
    "dep:flate2",
    "dep:aws-sdk-s3",
]

[[bin]]
name = "manabrew-hub"
path = "src/main.rs"
required-features = ["server"]

[dependencies]
manabrew-protocol = { path = "../manabrew-protocol", version = "5.6.1" }
serde = { workspace = true }
ts-rs = { workspace = true }
axum = { version = "0.7", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "fs", "io-util", "sync"], optional = true }
tower-http = { version = "0.5", features = ["cors"], optional = true }
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
serde_json = { workspace = true, optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
sha2 = { version = "0.10", optional = true }
rand = { version = "0.8", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
maud = { version = "0.26", features = ["axum"], optional = true }
aws-lc-rs = { version = "1", optional = true }
base64 = { version = "0.22", optional = true }
flate2 = { version = "1", optional = true }
aws-sdk-s3 = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio", "rustls", "behavior-version-latest"], optional = true }

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
