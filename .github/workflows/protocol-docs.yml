name: Protocol docs

# Two staleness gates for the protocol docs:
#   - the committed protocol-types.json (consumed by the docs site, which has
#     no cargo to regenerate it) has drifted from the protocol source;
#   - a docs page contradicts the source it describes (#777: "v1" against a
#     5.2.0 crate).
on:
  pull_request:
    paths:
      - "manabrew-rs/crates/manabrew-protocol/**"
      - "manabrew-rs/crates/manabrew-relay-protocol/**"
      - "scripts/gen-protocol-doc-types.mjs"
      - "scripts/check-docs-drift.mjs"
      - "website/src/generated/protocol-types.json"
      - "website/src/content/docs/protocol/**"
      - "packages/protocol/README.md"
      - "src/types/server.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: Docs match the protocol source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/check-docs-drift.mjs

  staleness:
    name: Generated protocol types are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install --global yarn

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: yarn install --frozen-lockfile

      - name: Regenerate
        run: yarn gen:protocol-docs

      - name: Fail if stale or uncommitted
        run: |
          git add website/src/generated/protocol-types.json
          git diff --cached --exit-code website/src/generated/protocol-types.json \
            || { echo "::error::website/src/generated/protocol-types.json is stale or uncommitted — run 'yarn gen:protocol-docs' and commit the result."; exit 1; }
