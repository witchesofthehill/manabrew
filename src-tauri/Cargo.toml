[package]
name = "manabrew"
version = "3.32.2"
edition = "2021"
publish = false

[features]
forge-room = ["dep:self-hosted-node", "dep:manabrew-server", "dep:mdns-sd", "direct-seat"]
# A native iroh endpoint for this machine's seat. Desktop only: mobile builds
# take the default features and have no reason to compile it.
direct-seat = ["dep:manabrew-net"]

[lib]
name = "manabrew_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
forge-cardset-archive = { path = "../manabrew-rs/crates/forge-cardset-archive", features = [
    "build",
] }
walkdir = "2"

[dependencies]
tauri = { version = "2.11.1", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
manabrew-engine = { path = "../manabrew-rs/crates/manabrew-engine" }
forge-foundation = { path = "../manabrew-rs/crates/forge-foundation" }
forge-carddb = { path = "../manabrew-rs/crates/forge-carddb" }
forge-cardset-archive = { path = "../manabrew-rs/crates/forge-cardset-archive" }
memmap2 = "0.9"
rand = "0.8"
# Finding a LAN room without typing an IP. No async runtime of its own, which
# keeps it out of tauri's.
mdns-sd = { version = "0.21", optional = true }
manabrew-net = { path = "../manabrew-rs/crates/manabrew-net", version = "0.1.0", optional = true }
tiny_http = "0.12"
tokio = { version = "1", features = ["rt", "sync", "macros", "time", "net"] }
manabrew-agent-interface = { path = "../manabrew-rs/crates/manabrew-agent-interface" }
manabrew-protocol = { path = "../manabrew-rs/crates/manabrew-protocol" }
forge-limited = { path = "../manabrew-rs/crates/forge-limited" }
tauri-plugin-http = "2.5.9"
# Already compiled for manabrew-server at the same version and TLS backend, so
# the card-art cache filling itself costs no new build.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "stream",
] }
# Scryfall's bulk card list is gzipped JSON Lines, streamed rather than held.
flate2 = "1"
futures-util = "0.3"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
self-hosted-node = { path = "../manabrew-rs/crates/self-hosted-node", default-features = false, features = [
    "graal-forge",
], optional = true }
manabrew-server = { path = "../manabrew-rs/crates/manabrew-server", optional = true }

[dev-dependencies]
tempfile = "3"
