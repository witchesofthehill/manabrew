name: Documentation issue
description: Report stale, missing, or confusing documentation.
title: "docs: "
labels: ["documentation"]
body:
  - type: input
    id: page
    attributes:
      label: Page or file
      placeholder: README.md, docs/PARITY_TESTING.md, ...
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is inaccurate, missing, or confusing?
    validations:
      required: true
  - type: textarea
    id: suggested
    attributes:
      label: Suggested change
      description: Optional wording or direction.
