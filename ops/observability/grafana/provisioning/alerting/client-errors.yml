apiVersion: 1

groups:
  - orgId: 1
    name: manabrew-client-errors
    folder: Manabrew
    interval: 1m
    rules:
      - uid: client-error-burst
        title: client error burst
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: production frontend errors reached 10 reported exceptions in 10 minutes
          dashboard: /d/manabrew-client-errors
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: loki
            model:
              expr: sum(count_over_time({app="manabrew-client",environment="production"} | json | __error__="" | kind="exception" [10m]))
              queryType: instant
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params: [9]

      - uid: client-collector-down
        title: client telemetry collector down
        condition: C
        for: 2m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: frontend collector or its Loki delivery target is unavailable
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: min(up{job="faro-collector"}) * min(faro_collector_loki_ready)
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator:
                    type: lt
                    params: [1]

      - uid: client-telemetry-export-errors
        title: client telemetry export failures
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: frontend collector has sustained export failures or Loki has dropped entries
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: (sum(increase(faro_collector_export_errors_total[5m])) or vector(0)) + (sum(increase(loki_write_dropped_entries_total[5m])) or vector(0))
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: client-telemetry-budget
        title: client telemetry daily budget nearly exhausted
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: frontend reports have reserved over 90 percent of the daily byte budget
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: faro_collector_daily_bytes / faro_collector_daily_limit_bytes
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0.9]

      - uid: client-telemetry-memory
        title: client telemetry memory pressure
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: isolated frontend collector RSS exceeds 80 percent of its 512 MiB limit
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: faro_collector_resident_memory_bytes
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params: [429496729.6]
