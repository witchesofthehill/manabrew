name: Staging deploy

# Builds the `:staging` images on every push to `staging`. This job ONLY builds
# and pushes to ghcr (docker-images.yml does the same on v* tags for the release
# `latest` images) — it does not deploy.
#
# The rollout itself is driven separately by a GitHub *webhook*: the staging VM
# sits behind Twingate (no inbound SSH from CI), but serves the app publicly on
# 443, so a repo webhook (Settings → Webhooks) POSTs to it on push and a small
# receiver on the box runs the production deploy.sh. deploy.sh's ghcr pull-retry
# waits out this build, so the two firing in parallel self-order. See
# docs/STAGING_WORKFLOW.md and ops/staging-deploy-hook.* for the receiver.
#
# No hostname is hardcoded here. The one build-time endpoint (the hub API URL
# baked into the web bundle) comes from the repo variable STAGING_HUB_API_URL;
# every other host is runtime and lives in the box .env (STAGING_APP_HOST /
# STAGING_RELAY_HOST / STAGING_API_HOST), so the domain can change without
# touching this workflow.
on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  # ── Build & push the :staging images ───────────────────────────────
  # Mirrors docker-images.yml's matrix. Shares its per-image gha cache scopes,
  # so the release builds' dependency layers are reused here and vice versa.
  # The web image bakes the hub endpoint (from the STAGING_HUB_API_URL repo
  # variable) and the same-origin symbol proxy; the relay is configured at
  # runtime (compose RELAY_HOST), like prod.
  build-images:
    name: Build & push ${{ matrix.image }} (staging tag)
    if: github.repository == 'witchesofthehill/manabrew'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: manabrew-server
            dockerfile: manabrew-rs/crates/manabrew-server/Dockerfile
          - image: manabrew-web
            dockerfile: Dockerfile.web
            build-args: |
              VITE_SCRYFALL_SYMBOL_BASE=/scryfall-symbols/
              VITE_HUB_API_URL=${{ vars.STAGING_HUB_API_URL }}
          - image: manabrew-node
            dockerfile: manabrew-rs/crates/self-hosted-node/Dockerfile
          - image: manabrew-hub
            dockerfile: manabrew-rs/crates/manabrew-hub/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build-args }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:staging
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
