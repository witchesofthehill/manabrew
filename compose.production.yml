services:
  # Edge proxy: owns 80/443 + TLS for every host (ops/Caddyfile) and never
  # runs app code, so app rollouts leave it up — stopping the container
  # that holds 80/443 severs every live relay websocket. Deploys create it
  # with a dedicated `up --no-recreate` and otherwise never list it; config
  # changes land via `caddy reload`. No depends_on: compose restarts a
  # dependent whenever its dependency is recreated, which is exactly the
  # bounce this container must never take.
  ingress:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    # Bcrypt hash for the push./loki. ingress (single-quote in secrets — contains `$`).
    # Unset on the host stays unset here, so the Caddyfile's locked fallback applies.
    environment:
      PUSHGATEWAY_PASSWORD_HASH:
      # Bcrypt hash for the api. /admin/* ingress (same single-quote caveat).
      HUB_ADMIN_PASSWORD_HASH:

  manabrew:
    # Pre-built in CI (docker-images.yml) and pulled here — the web image is a
    # ~1h WASM+Vite build that does not fit the prod host's disk. The published
    # image is relay-agnostic; it is pointed at the relay at RUNTIME via the
    # RELAY_* env below (ops/web-entrypoint.sh writes /srv/manabrew/config.js),
    # replacing the old VITE_RELAY_* build args. NOTE: the CI image is built
    # without VITE_SCRYFALL_SYMBOL_BASE, so mana symbols load from
    # svgs.scryfall.io directly rather than the /scryfall-symbols/ Caddy proxy —
    # make it runtime-configurable if the proxy is required.
    image: ghcr.io/witchesofthehill/manabrew-web:${MANABREW_IMAGE_TAG:-latest}
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./ops/web.Caddyfile:/etc/caddy/Caddyfile:ro
      - ./ops/status.json:/srv/manabrew/status.json:ro
      - ./ops/sidestore:/srv/manabrew/sidestore:ro
    environment:
      # Runtime relay config (entrypoint writes config.js from these).
      RELAY_HOST: relay.manabrew.app
      RELAY_PORT: "443"
      RELAY_PASSWORD: "${MANABREW_SERVER_KEY:?MANABREW_SERVER_KEY is required}"
      # Enable the Forge "Play vs AI" hosted engine option (the published image
      # ships it off). Run the node with `--profile hosted-ai` for it to work.
      HOSTED_AI_ENABLED: "${HOSTED_AI_ENABLED:-true}"
      # Set DESIGN_SYSTEM=1 on the host to expose /design-system on this build.
      DESIGN_SYSTEM: "${DESIGN_SYSTEM:-}"
      # Runtime feature flags (config.js; enable-only). Accounts, email
      # sign-in, and the deck hub ship on.
      ACCOUNTS: "${ACCOUNTS:-1}"
      DECK_HUB: "${DECK_HUB:-1}"
      EMAIL_SIGN_IN: "${EMAIL_SIGN_IN:-1}"
      FORGE_WASM: "${FORGE_WASM:-1}"
    # No depends_on for manabrew-hub: the site must deploy/restart even if the
    # hub image is broken; caddy just 502s api. until the hub comes up.
    depends_on:
      - manabrew-server

  manabrew-server:
    # Pre-built in CI (docker-images.yml) and pulled. `cargo xtask deploy`
    # compares the pulled binary against the running one and only restarts the
    # relay when it changed — a relay restart drops every live game.
    image: ghcr.io/witchesofthehill/manabrew-server:${MANABREW_IMAGE_TAG:-latest}
    environment:
      FORGE_HOST: "0.0.0.0"
      FORGE_PORT: "9443"
      FORGE_HEALTH_PORT: "9444"
      FORGE_MAX_ROOMS: "100"
      MANABREW_SERVER_KEY: "${MANABREW_SERVER_KEY:?MANABREW_SERVER_KEY is required}"
      DECK_HUB: "${DECK_HUB:-1}"
      MANABREW_HUB_DECK_PLAYS_URL: "http://manabrew-hub:9500"
      MANABREW_HUB_JWKS_URL: "http://manabrew-hub:9500/api/auth/jwks"
      MANABREW_HUB_DECK_PLAYS_TOKEN: "${MANABREW_SERVER_KEY:?MANABREW_SERVER_KEY is required}"
      SECRET_MANABREW_KEY: "${SECRET_MANABREW_KEY:-}"
      RUST_LOG: "manabrew_server=info"
      # Events + captures live on the host filesystem, never a container layer.
      MANABREW_EVENTS_DIR: "/var/manabrew/events"
      MANABREW_GAME_CAPTURE_DIR: "/var/manabrew/captures"
      MANABREW_GAME_CAPTURE_MAX_GB: "${MANABREW_GAME_CAPTURE_MAX_GB:-20}"
    volumes:
      - ./ops/observability/data/events:/var/manabrew/events
      - ./ops/observability/data/captures:/var/manabrew/captures
    expose:
      - "9443"
      - "9444"
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.5
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9444/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  manabrew-hub:
    # Pre-built in CI (docker-images.yml) and pulled.
    image: ghcr.io/witchesofthehill/manabrew-hub:${MANABREW_IMAGE_TAG:-latest}
    environment:
      HUB_HOST: "0.0.0.0"
      HUB_PORT: "9500"
      # hub.db on the host filesystem so it rides the existing restic backups.
      HUB_DB_PATH: "/var/manabrew/hub/hub.db"
      HUB_ANALYTICS_IMPORT_DB_PATH: "/var/manabrew/events/events.db"
      HUB_RELAY_DECK_PLAYS_TOKEN: "${MANABREW_SERVER_KEY:?MANABREW_SERVER_KEY is required}"
      DECK_HUB: "${DECK_HUB:-1}"
      RUST_LOG: "manabrew_hub=info"
      # Auth (/api/auth/*). Client ids/secrets live in ops/production.secrets;
      # an unset client id disables that provider. No RESEND_API_KEY → the
      # email sign-in endpoint returns 503.
      HUB_PUBLIC_URL: "https://api.manabrew.app"
      WEB_APP_URL: "https://play.manabrew.app"
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:-}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET:-}"
      DISCORD_CLIENT_ID: "${DISCORD_CLIENT_ID:-}"
      DISCORD_CLIENT_SECRET: "${DISCORD_CLIENT_SECRET:-}"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      # The Resend key is scoped to the verified mail.manabrew.app domain; the
      # compiled default sender uses the bare domain and gets a 403.
      AUTH_EMAIL_FROM: "${AUTH_EMAIL_FROM:-Manabrew <login@mail.manabrew.app>}"
    volumes:
      - ./ops/hub-data:/var/manabrew/hub
      - ./ops/observability/data/events:/var/manabrew/events
    expose:
      - "9500"
    restart: unless-stopped
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9500/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Headless engine node hosting a room for web "Play vs AI". Opt-in: the
  # default deploy doesn't build/run it (Play-vs-AI works client-side). Start
  # it with `docker compose --profile hosted-ai up` (and build the web with
  # VITE_HOSTED_AI_ENABLED=true). Its room is `hosted`, so it never appears in
  # the human lobby browse list — the node can stay live without advertising.
  self-hosted-node:
    profiles:
      - hosted-ai
    # Pre-built in CI (docker-images.yml) and pulled.
    image: ghcr.io/witchesofthehill/manabrew-node:${MANABREW_IMAGE_TAG:-latest}
    environment:
      SELF_HOSTED_NODE_RELAY_URL: "ws://manabrew-server:9443"
      SELF_HOSTED_NODE_SERVER_KEY: "${MANABREW_SERVER_KEY:?MANABREW_SERVER_KEY is required}"
      SELF_HOSTED_NODE_FORMAT: "${SELF_HOSTED_NODE_FORMAT:-commander}"
      SELF_HOSTED_NODE_MAX_PLAYERS: "${SELF_HOSTED_NODE_MAX_PLAYERS:-2}"
      SELF_HOSTED_NODE_GAMES_PER_JVM: "1"
      SELF_HOSTED_NODE_METRICS_PUSH_URL: "${SELF_HOSTED_NODE_METRICS_PUSH_URL:-}"
      SELF_HOSTED_NODE_JAVA_HEAP_MB: "${SELF_HOSTED_NODE_JAVA_HEAP_MB:-}"
      SELF_HOSTED_NODE_JAVA_ACTIVE_PROCESSORS: "${SELF_HOSTED_NODE_JAVA_ACTIVE_PROCESSORS:-}"
      SELF_HOSTED_NODE_JAVA_GC_LOG: "${SELF_HOSTED_NODE_JAVA_GC_LOG:-}"
      RUST_LOG: "self_hosted_node=info"
    depends_on:
      - manabrew-server
    restart: unless-stopped

  # ── Observability stack — opt-in via COMPOSE_PROFILES=observability ──
  # (images pulled, never built; config under ops/observability/)
  prometheus:
    profiles:
      - observability
    image: prom/prometheus:v3.4.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./ops/observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    expose:
      - "9090"
    restart: unless-stopped
    mem_limit: 512m

  # Remote nodes push here via push.manabrew.app; stale pushes = fleet-down alert.
  pushgateway:
    profiles:
      - observability
    image: prom/pushgateway:v1.11.1
    # image runs as nobody, but the fresh named volume is root-owned
    user: root
    command:
      - --persistence.file=/data/pushgateway.dat
      - --persistence.interval=5m
    volumes:
      - pushgateway-data:/data
    expose:
      - "9091"
    restart: unless-stopped
    mem_limit: 64m

  grafana:
    profiles:
      - observability
    image: grafana/grafana:11.6.1
    environment:
      GF_SERVER_ROOT_URL: "https://grafana.manabrew.app"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: "frser-sqlite-datasource"
      DISCORD_WEBHOOK_URL: "${DISCORD_WEBHOOK_URL:-https://discord.invalid/webhook-not-configured}"
    volumes:
      - ./ops/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./ops/observability/data/events:/var/manabrew/events:ro
      - grafana-data:/var/lib/grafana
    expose:
      - "3000"
    restart: unless-stopped
    mem_limit: 384m

  loki:
    profiles:
      - observability
    image: grafana/loki:3.5.0
    command:
      - -config.file=/etc/loki/loki.yml
    volumes:
      - ./ops/observability/loki:/etc/loki:ro
      - loki-data:/loki
    expose:
      - "3100"
    restart: unless-stopped
    mem_limit: 384m

  events-ingester:
    profiles:
      - observability
    image: python:3.12-alpine
    command:
      - python
      - /app/ingest-events.py
      - --dir
      - /var/manabrew/events
      - --hub-db
      - /var/manabrew/hub/hub.db
      - --watch
      - "300"
    volumes:
      - ./scripts/ingest-events.py:/app/ingest-events.py:ro
      - ./ops/observability/data/events:/var/manabrew/events
      - ./ops/hub-data:/var/manabrew/hub
    restart: unless-stopped
    mem_limit: 64m

  alloy:
    profiles:
      - observability
    image: grafana/alloy:v1.9.1
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./ops/observability/alloy:/etc/alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    restart: unless-stopped
    mem_limit: 128m

volumes:
  caddy-data:
  caddy-config:
  prometheus-data:
  pushgateway-data:
  grafana-data:
  loki-data:
  alloy-data:
