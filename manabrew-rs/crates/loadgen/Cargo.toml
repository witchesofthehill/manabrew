[package]
name = "loadgen"
version = "0.2.0"
edition = "2021"
license.workspace = true
description = "Throwaway prod load generator for hosted rooms"
publish = false

[[bin]]
name = "loadgen"
path = "src/main.rs"

[dependencies]
manabrew-agent-interface = { path = "../manabrew-agent-interface", version = "0.10.2" }
manabot = { path = "../manabot/", version = "0.10.4" }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
serde_json = { workspace = true }
uuid = { version = "1", features = ["v4"] }
